name: weekly-entry-pipeline
on:
  schedule:
    - cron: '0 18 * * 0'      # niedziela 18:00 UTC (~20:00 PL)
    - cron: '0 14 * * 3'      # sroda 14:00 UTC (~16:00 PL) - drugi run w tygodniu
    - cron: '0 0 * * 5'       # piatek 00:00 UTC (~02:00 PL) - trzeci run, podbita czestotliwosc
  workflow_dispatch:
    inputs:
      quality:
        description: 'Preset jakosci: optimal | lean | max'
        default: 'optimal'
permissions:
  contents: read
  id-token: write
# PUBLIC REPO: logi tego workflowu widzi kazdy. claude-code-action ma show_full_output
# wylaczone (wypisuje tylko prompt z tego pliku + metadane), skrypty czytajace dane
# ida przez quiet-run.sh, a do logu / Job Summary trafiaja tylko liczby z
# public_summary.py. NIE odpalaj re-runu z "Enable debug logging" — debug mode
# wypisuje pelny przebieg sesji Claude'a, lacznie z tresc raportow.
jobs:
  gem:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: preflight - required secrets
        id: preflight
        env:
          DATA_APP_CLIENT_ID: ${{ secrets.DATA_APP_CLIENT_ID }}
          DATA_APP_PRIVATE_KEY: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: .github/scripts/require-env.sh DATA_APP_CLIENT_ID DATA_APP_PRIVATE_KEY CLAUDE_CODE_OAUTH_TOKEN GMAIL_USERNAME GMAIL_APP_PASSWORD MAIL_TO

      - name: set report path
        run: echo "REPORT_FILE=reports/gem-$(date +%F).md" >> "$GITHUB_ENV"

      - name: mint data-repo token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: investing-partner-data

      - name: checkout private data repo
        id: data
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/investing-partner-data
          token: ${{ steps.app-token.outputs.token }}
          path: data

      - name: link data repo into place
        run: |
          # Every path the pipeline/skill code touches (history/, reports/,
          # closed_positions.csv) lives in the private investing-partner-data
          # repo (checked out to ./data). Symlink it to the paths SKILL.md and
          # the agents already expect at repo root — no prompt/code changes
          # needed below this step.
          mkdir -p data/reports
          mkdir -p data/.claude/skills/gem-inwestycyjny/history/runbook/full
          [ -f data/closed_positions.csv ] || touch data/closed_positions.csv
          ln -sfn "$(pwd)/data/reports" reports
          ln -sfn "$(pwd)/data/.claude/skills/gem-inwestycyjny/history" .claude/skills/gem-inwestycyjny/history
          ln -sf "$(pwd)/data/closed_positions.csv" closed_positions.csv

      - name: run gem-inwestycyjny pipeline
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: false   # public repo — never flip this on
          prompt: |
            /gem-inwestycyjny ${{ github.event.inputs.quality && format('--quality={0}', github.event.inputs.quality) || '' }}

            Wykonaj WSZYSTKIE kroki opisane w SKILL.md, łącznie z Krokiem 1 (zapis
            historii Scouta do history/scout_<data>.md i history/scout_tickers.csv)
            i Krokiem 6 (Recommendation Tracking Log — zapis do
            history/recommendations.csv dla każdego tickera z ZIELONE_SWIATLO: TAK).
            To są wymagane efekty tego runu, nie pomiń ich.

            Na końcu zapisz finalną kompozycję widoku (DIRECTOR_FINAL + appendix
            z pełnymi raportami agentów, dokładnie jak opisano w sekcji "Finalna
            kompozycja widoku" SKILL.md) jako plik markdown w ${{ env.REPORT_FILE }}.

            Nie commituj, nie twórz PR — commit do repo wykonuje osobny krok
            workflow po tobie.
          claude_args: |
            --max-turns 60
            --max-budget-usd 12.00
            --permission-mode bypassPermissions
            --allowedTools "Task" "Agent" "ToolSearch" "Read" "Write" "Edit" "Glob" "Grep" "WebSearch" "WebFetch" "NotebookRead" "TodoWrite" "Bash(pip install *)" "Bash(python3 *)" "Bash(python *)" "Bash(mkdir -p *)" "Bash(ls *)" "Bash(find *)" "Bash(cat *)" "Bash(echo *)" "Bash(git status*)" "Bash(git log*)" "Bash(git diff*)" "Bash(curl *)"
            --disallowedTools "ScheduleWakeup" "SendMessage" "TaskCreate" "TaskUpdate" "TaskGet" "TaskList" "TaskOutput" "TaskStop" "Monitor" "PushNotification"

      - name: annotate re-entry context
        if: always() && steps.data.outcome == 'success'
        run: |
          # pamiec miedzysystemowa: dopisz do swiezo zalogowanych rekomendacji
          # kontekst wyjscia, jesli ich ticker jest w closed_positions.csv.
          # Deterministyczny, idempotentny, tylko stdlib — bez pip.
          .github/scripts/quiet-run.sh reentry-context - -- \
            python3 skills/gem-position-auditor/reentry_context.py \
            .claude/skills/gem-inwestycyjny/history/recommendations.csv closed_positions.csv \
            || echo "reentry_context: non-fatal, pomijam"

      - name: capture run log
        if: always() && steps.data.outcome == 'success'
        run: |
          RUNBOOK_DIR=.claude/skills/gem-inwestycyjny/history/runbook
          FULL_DIR="$RUNBOOK_DIR/full"
          SUMMARY_FILE="$RUNBOOK_DIR/summary.jsonl"
          mkdir -p "$FULL_DIR"

          SRC=/home/runner/work/_temp/claude-execution-output.json
          if [ ! -f "$SRC" ]; then
            SRC=$(find /home/runner/work/_temp -maxdepth 1 -name '*execution-output*.json' 2>/dev/null | head -n1)
          fi

          DATE=$(date +%F)
          RUN_FILE="$FULL_DIR/run-${{ github.run_id }}-$DATE.json"

          if [ -n "$SRC" ] && [ -f "$SRC" ]; then
            cp "$SRC" "$RUN_FILE"
          else
            echo '{"error":"execution log not found at expected path"}' > "$RUN_FILE"
          fi

          # full summary (incl. error text) -> private summary.jsonl;
          # only turns/cost/stage timing -> public log + Job Summary
          python3 .github/scripts/public_summary.py claude-run "$RUN_FILE" "$SUMMARY_FILE" \
            --run-id "${{ github.run_id }}" --date "$DATE" --title "Gem pipeline (Scout → Director)"
          python3 .github/scripts/public_summary.py funnel \
            .claude/skills/gem-inwestycyjny/history/recommendations.csv \
            .claude/skills/gem-inwestycyjny/history/scout_tickers.csv --date "$DATE"

          # keep only the newest 10 full logs; older runs survive only as a summary.jsonl line
          (cd "$FULL_DIR" && ls -1t run-*.json 2>/dev/null | tail -n +11 | xargs -r rm --)

          # keep only the newest 30 summary records
          if [ -f "$SUMMARY_FILE" ]; then
            tail -n 30 "$SUMMARY_FILE" > "$SUMMARY_FILE.tmp" && mv "$SUMMARY_FILE.tmp" "$SUMMARY_FILE"
          fi

      - name: verify report produced
        if: always() && steps.data.outcome == 'success'
        run: |
          # Guard against the "green but empty" failure mode: the action can
          # self-report success while having stalled mid-pipeline (no report).
          # Decide REPORT_OK here; the email + final-status steps branch on it.
          #
          # A second, sneakier failure mode: the orchestrator sees that
          # reports/gem-<today>.md already exists from an earlier run today
          # (e.g. a manual re-run with a different --quality after the
          # scheduled run already succeeded) and short-circuits without
          # dispatching any subagents — leaving the pre-existing file
          # untouched. It still contains the right keywords (from the
          # earlier run), so the keyword check alone would pass. Catch this
          # by requiring the file to actually differ from the data repo's
          # committed HEAD state.
          REPORT_CHANGED=$(cd data && git status --porcelain -- "$REPORT_FILE")
          if [ -s "$REPORT_FILE" ] && grep -qiE "Karta Zlece|DIRECTOR|Gem Inwestycyjny" "$REPORT_FILE" && [ -n "$REPORT_CHANGED" ]; then
            echo "REPORT_OK=true" >> "$GITHUB_ENV"
            echo "Report present, non-trivial, and changed this run: $REPORT_FILE"
          elif [ -s "$REPORT_FILE" ] && [ -z "$REPORT_CHANGED" ]; then
            echo "REPORT_OK=false" >> "$GITHUB_ENV"
            echo "::error::Pipeline reported success but $REPORT_FILE is byte-identical to the committed version — orchestrator likely short-circuited (saw today's report already exists) without dispatching any subagents."
          else
            echo "REPORT_OK=false" >> "$GITHUB_ENV"
            echo "::error::Pipeline reported success but $REPORT_FILE is missing/empty — partial run (no Director report)."
          fi

      - name: commit report
        if: always() && steps.data.outcome == 'success'
        run: |
          cd data
          git config user.name "gem-bot"
          git config user.email "gem-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository_owner }}/investing-partner-data.git"
          [ -f "$REPORT_FILE" ] && git add "$REPORT_FILE"
          [ -f closed_positions.csv ] && git add closed_positions.csv
          [ -d .claude/skills/gem-inwestycyjny/history ] && git add .claude/skills/gem-inwestycyjny/history
          [ -d ci-logs ] && git add ci-logs
          git commit -q -m "gem pipeline: $(date +%F) (run ${{ github.run_id }})" || echo "no changes"
          git push -q

      - name: set email subject date
        if: always()
        run: echo "MAIL_DATE=$(date +%d.%m.%Y)" >> "$GITHUB_ENV"

      - name: email report
        if: always() && env.REPORT_OK == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Gem Inwestycyjny
          to: ${{ secrets.MAIL_TO }}
          subject: "Gem Inwestycyjny — kandydaci ${{ env.MAIL_DATE }}"
          html_body: file://${{ env.REPORT_FILE }}
          convert_markdown: true

      - name: email failure notice
        if: always() && steps.preflight.outcome == 'success' && env.REPORT_OK != 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Gem Inwestycyjny
          to: ${{ secrets.MAIL_TO }}
          subject: "⚠️ Gem Inwestycyjny — run NIEUDANY ${{ env.MAIL_DATE }}"
          body: |
            Pipeline zakończył się bez raportu (brak/pusty ${{ env.REPORT_FILE }}).
            Najczęstsze przyczyny: budżet/timeout/limit Pro, albo orchestrator
            zatrzymał się w połowie. Sprawdź logi i runbook:

            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: fail job if report missing
        if: always()
        run: |
          if [ "${REPORT_OK:-false}" != "true" ]; then
            echo "::error::Marking job as failed — no Director report produced."
            exit 1
          fi
