name: monthly-performance-digest
on:
  # WYLACZONE do czasu pelnego configu (sekrety + wylaczenie workflowow w investing-partner-data).
  # Wlaczenie = odkomentuj ponizsze linie.
  # schedule:
  #   - cron: '0 8 1 * *'      # 1. dzien miesiaca, 08:00 UTC (~10:00 PL)
  workflow_dispatch:
permissions:
  contents: read
# PUBLIC REPO: logi tego workflowu widzi kazdy — digest idzie przez quiet-run.sh
# prosto do pliku w data/ i mailem, nigdy na stdout.
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: preflight - required secrets
        id: preflight
        env:
          DATA_APP_CLIENT_ID: ${{ secrets.DATA_APP_CLIENT_ID }}
          DATA_APP_PRIVATE_KEY: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: .github/scripts/require-env.sh DATA_APP_CLIENT_ID DATA_APP_PRIVATE_KEY GMAIL_USERNAME GMAIL_APP_PASSWORD MAIL_TO

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: set report path
        run: echo "REPORT_FILE=reports/performance-digest-$(date +%F).md" >> "$GITHUB_ENV"

      - name: mint data-repo token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: investing-partner-data

      - name: checkout private data repo
        id: data
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/investing-partner-data
          token: ${{ steps.app-token.outputs.token }}
          path: data

      - name: link data repo into place
        run: |
          mkdir -p data/reports
          ln -sfn "$(pwd)/data/reports" reports
          ln -sfn "$(pwd)/data/.claude/skills/gem-inwestycyjny/history" .claude/skills/gem-inwestycyjny/history
          ln -sf "$(pwd)/data/closed_positions.csv" closed_positions.csv

      - name: run performance digest
        run: |
          pip install -q yfinance pandas
          .github/scripts/quiet-run.sh performance-digest "$REPORT_FILE" -- \
            python skills/performance-digest/performance_digest.py \
            --recommendations .claude/skills/gem-inwestycyjny/history/recommendations.csv \
            --closed closed_positions.csv \
            --scout .claude/skills/gem-inwestycyjny/history/scout_tickers.csv
          echo "### Performance Digest" >> "$GITHUB_STEP_SUMMARY"
          echo "Raport wygenerowany ($(wc -l < "$REPORT_FILE") linii) — commit do repo danych + mail." >> "$GITHUB_STEP_SUMMARY"

      - name: commit report
        if: always() && steps.data.outcome == 'success'
        run: |
          cd data
          git config user.name "gem-bot"
          git config user.email "gem-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository_owner }}/investing-partner-data.git"
          [ -f "$REPORT_FILE" ] && git add "$REPORT_FILE"
          [ -d ci-logs ] && git add ci-logs
          git commit -q -m "performance digest: $(date +%F) (run ${{ github.run_id }})" || echo "no changes"
          git push -q

      - name: set email subject date
        if: always()
        run: echo "MAIL_DATE=$(date +%d.%m.%Y)" >> "$GITHUB_ENV"

      - name: email report
        if: always() && steps.data.outcome == 'success' && hashFiles(format('data/{0}', env.REPORT_FILE)) != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Performance Digest
          to: ${{ secrets.MAIL_TO }}
          subject: "Performance Digest — ${{ env.MAIL_DATE }}"
          html_body: file://${{ env.REPORT_FILE }}
          convert_markdown: true
