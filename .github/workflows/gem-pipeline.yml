name: weekly-entry-pipeline
on:
  schedule:
    - cron: '0 18 * * 0'      # niedziela 18:00 UTC (~20:00 PL)
  workflow_dispatch:
    inputs:
      quality:
        description: 'Preset jakosci: optimal | lean | max'
        default: 'optimal'
permissions:
  contents: write
  id-token: write
jobs:
  gem:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: set report path
        run: echo "REPORT_FILE=reports/gem-$(date +%F).md" >> "$GITHUB_ENV"

      - name: ensure reports dir
        run: mkdir -p reports

      - name: run gem-inwestycyjny pipeline
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            /gem-inwestycyjny ${{ github.event.inputs.quality && format('--quality={0}', github.event.inputs.quality) || '' }}

            Wykonaj WSZYSTKIE kroki opisane w SKILL.md, łącznie z Krokiem 1 (zapis
            historii Scouta do history/scout_<data>.md i history/scout_tickers.csv)
            i Krokiem 6 (Recommendation Tracking Log — zapis do
            history/recommendations.csv dla każdego tickera z ZIELONE_SWIATLO: TAK).
            To są wymagane efekty tego runu, nie pomiń ich.

            Na końcu zapisz finalną kompozycję widoku (DIRECTOR_FINAL + appendix
            z pełnymi raportami agentów, dokładnie jak opisano w sekcji "Finalna
            kompozycja widoku" SKILL.md) jako plik markdown w ${{ env.REPORT_FILE }}.

            Nie commituj, nie twórz PR — commit do repo wykonuje osobny krok
            workflow po tobie.
          claude_args: |
            --max-turns 60
            --max-budget-usd 12.00
            --allowedTools "Task" "Read" "Write" "WebSearch" "Bash(pip install *)" "Bash(python3 *)" "Bash(python *)" "Bash(mkdir -p *)"
          show_full_output: true

      - name: capture run log
        if: always()
        run: |
          RUNBOOK_DIR=.claude/skills/gem-inwestycyjny/history/runbook
          FULL_DIR="$RUNBOOK_DIR/full"
          SUMMARY_FILE="$RUNBOOK_DIR/summary.jsonl"
          mkdir -p "$FULL_DIR"

          SRC=/home/runner/work/_temp/claude-execution-output.json
          if [ ! -f "$SRC" ]; then
            SRC=$(find /home/runner/work/_temp -maxdepth 1 -name '*execution-output*.json' 2>/dev/null | head -n1)
          fi

          DATE=$(date +%F)
          RUN_FILE="$FULL_DIR/run-${{ github.run_id }}-$DATE.json"

          if [ -n "$SRC" ] && [ -f "$SRC" ]; then
            cp "$SRC" "$RUN_FILE"
          else
            echo '{"error":"execution log not found at expected path"}' > "$RUN_FILE"
          fi

          python3 - "$RUN_FILE" "$DATE" "${{ github.run_id }}" >> "$SUMMARY_FILE" <<'PYEOF'
          import json, sys
          path, date, run_id = sys.argv[1], sys.argv[2], sys.argv[3]
          try:
              with open(path) as f:
                  data = json.load(f)
          except Exception as e:
              print(json.dumps({"run_id": run_id, "date": date, "error": f"failed to parse log: {e}"}))
              sys.exit(0)
          events = data if isinstance(data, list) else [data]
          result = next((e for e in reversed(events) if isinstance(e, dict) and e.get("type") == "result"), {})
          denials = result.get("permission_denials") or []

          # reconstruct per-stage timing from Task tool dispatch/completion events.
          # each Scout/Quant/Alpha/Auditor/Director call (and Scout's own search-wave
          # sub-tasks) shows up here as one entry, in chronological order.
          descriptions = {}
          completions = []
          seen_task_ids = set()
          for e in events:
              if not isinstance(e, dict) or e.get("type") != "system":
                  continue
              if e.get("subtype") == "task_started" and e.get("task_id"):
                  descriptions.setdefault(e["task_id"], e.get("description", e["task_id"]))
              elif e.get("subtype") == "task_updated":
                  patch = e.get("patch") or {}
                  tid = e.get("task_id")
                  if patch.get("status") == "completed" and patch.get("end_time") and tid not in seen_task_ids:
                      seen_task_ids.add(tid)
                      completions.append((tid, patch["end_time"]))
          completions.sort(key=lambda x: x[1])

          duration_ms = result.get("duration_ms")
          approx_start_ms = (completions[-1][1] - duration_ms) if (completions and duration_ms) else None

          timeline = []
          prev_end = approx_start_ms
          for tid, end_ms in completions:
              desc = descriptions.get(tid, tid)[:80]
              elapsed_sec = round((end_ms - prev_end) / 1000, 1) if prev_end is not None else None
              timeline.append({"stage": desc, "elapsed_sec": elapsed_sec})
              prev_end = end_ms

          summary = {
              "run_id": run_id,
              "date": date,
              "subtype": result.get("subtype"),
              "is_error": result.get("is_error"),
              "num_turns": result.get("num_turns"),
              "total_cost_usd": result.get("total_cost_usd"),
              "permission_denials_count": result.get("permission_denials_count", len(denials)),
              "error": result.get("result") if result.get("is_error") else None,
              "stage_timeline": timeline,
          }
          print(json.dumps(summary))

          sys.stderr.write("\n--- stage timing (run %s) ---\n" % run_id)
          for t in timeline:
              secs = "%6.1fs" % t["elapsed_sec"] if t["elapsed_sec"] is not None else "    ?s"
              sys.stderr.write("%s  %s\n" % (secs, t["stage"]))
          sys.stderr.write("-----------------------------\n")
          PYEOF

          # keep only the newest 10 full logs; older runs survive only as a summary.jsonl line
          (cd "$FULL_DIR" && ls -1t run-*.json 2>/dev/null | tail -n +11 | xargs -r rm --)

          # keep only the newest 30 summary records
          if [ -f "$SUMMARY_FILE" ]; then
            tail -n 30 "$SUMMARY_FILE" > "$SUMMARY_FILE.tmp" && mv "$SUMMARY_FILE.tmp" "$SUMMARY_FILE"
          fi

      - name: commit report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "gem-bot"
          git config user.email "gem-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          [ -f "$REPORT_FILE" ] && git add "$REPORT_FILE"
          [ -d .claude/skills/gem-inwestycyjny/history ] && git add .claude/skills/gem-inwestycyjny/history
          git commit -m "gem pipeline: $(date +%F) (run ${{ github.run_id }})" || echo "no changes"
          git push

      - name: set email subject date
        if: always()
        run: echo "MAIL_DATE=$(date +%d.%m.%Y)" >> "$GITHUB_ENV"

      - name: email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Gem Inwestycyjny
          to: ${{ secrets.MAIL_TO }}
          subject: "Gem Inwestycyjny — kandydaci ${{ env.MAIL_DATE }}"
          html_body: file://${{ env.REPORT_FILE }}
          convert_markdown: true
