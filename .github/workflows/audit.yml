name: weekly-position-audit
on:
  schedule:
    - cron: '0 7 * * 0'      # niedziela 07:00 UTC (~09:00 PL latem)
  workflow_dispatch:          # reczne odpalenie z zakladki Actions
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - run: python skills/gem-position-auditor/position_auditor.py holdings.json | tee audit_report.txt
      - name: commit state
        run: |
          git config user.name "gem-bot"
          git config user.email "gem-bot@users.noreply.github.com"
          git add stops_state.json audit_report.txt audit_report.html
          git commit -m "weekly audit $(date +%F)" || echo "no changes"
          git push
      - name: set report date
        if: always()
        run: echo "REPORT_DATE=$(date +%F)" >> "$GITHUB_ENV"
      - name: email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Gem Position Auditor
          to: ${{ secrets.MAIL_TO }}
          subject: "Position Audit ${{ env.REPORT_DATE }}"
          html_body: file://audit_report.html
