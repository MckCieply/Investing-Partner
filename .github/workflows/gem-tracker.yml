name: weekly-recommendation-tracker
on:
  schedule:
    - cron: '0 8 * * 5'      # piatek 08:00 UTC (~10:00 PL)
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
# PUBLIC REPO: logi tego workflowu widzi kazdy — zasady jak w gem-pipeline.yml
# (show_full_output off, quiet-run.sh, tylko liczby z public_summary.py, bez debug mode).
jobs:
  tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: preflight - required secrets
        id: preflight
        env:
          DATA_APP_CLIENT_ID: ${{ secrets.DATA_APP_CLIENT_ID }}
          DATA_APP_PRIVATE_KEY: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: .github/scripts/require-env.sh DATA_APP_CLIENT_ID DATA_APP_PRIVATE_KEY CLAUDE_CODE_OAUTH_TOKEN GMAIL_USERNAME GMAIL_APP_PASSWORD MAIL_TO

      - name: set report path
        run: echo "REPORT_FILE=reports/tracker-$(date +%F).md" >> "$GITHUB_ENV"

      - name: mint data-repo token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.DATA_APP_CLIENT_ID }}
          private-key: ${{ secrets.DATA_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: investing-partner-data

      - name: checkout private data repo
        id: data
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/investing-partner-data
          token: ${{ steps.app-token.outputs.token }}
          path: data

      - name: link data repo into place
        run: |
          mkdir -p data/reports
          mkdir -p data/.claude/skills/gem-inwestycyjny/tracker-runbook/full
          [ -f data/closed_positions.csv ] || touch data/closed_positions.csv
          ln -sfn "$(pwd)/data/reports" reports
          ln -sfn "$(pwd)/data/.claude/skills/gem-inwestycyjny/history" .claude/skills/gem-inwestycyjny/history
          ln -sfn "$(pwd)/data/.claude/skills/gem-inwestycyjny/tracker-runbook" .claude/skills/gem-inwestycyjny/tracker-runbook
          ln -sf "$(pwd)/data/closed_positions.csv" closed_positions.csv

      - name: run Weekly Tracker (Agent 06)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: false   # public repo — never flip this on
          prompt: |
            Wykonaj WYŁĄCZNIE sekcję "Weekly Tracker (osobny przepływ, nie część
            głównego pipeline'u)" z .claude/skills/gem-inwestycyjny/SKILL.md:
            przeczytaj .claude/skills/gem-inwestycyjny/agents/06-tracker.md i
            dispatchuj go jako Task zgodnie z instrukcją (model haiku). NIE
            odpalaj Scout/Quant/Alpha/Auditor/Director — wyłącznie Tracker.

            Tracker zaktualizuje .claude/skills/gem-inwestycyjny/history/recommendations.csv
            (status, last_checked_date/price, pct_change_since_entry, pct_to_target,
            date_resolved). Po zakończeniu zapisz output agenta (krótkie markdown
            podsumowanie tygodnia) jako plik markdown w ${{ env.REPORT_FILE }}.
            To jedyny wymagany efekt — nie commituj, nie twórz PR, nie wykonuj
            żadnych innych zmian w repo poza aktualizacją recommendations.csv
            i zapisem REPORT_FILE.
          claude_args: |
            --max-turns 30
            --max-budget-usd 2.00
            --permission-mode bypassPermissions
            --allowedTools "Task" "Agent" "ToolSearch" "Read" "Write" "Edit" "Glob" "Grep" "WebFetch" "NotebookRead" "TodoWrite" "Bash(pip install *)" "Bash(python3 *)" "Bash(python *)" "Bash(ls *)" "Bash(find *)" "Bash(cat *)" "Bash(echo *)" "Bash(git status*)" "Bash(git log*)" "Bash(git diff*)"
            --disallowedTools "ScheduleWakeup" "SendMessage" "TaskCreate" "TaskUpdate" "TaskGet" "TaskList" "TaskOutput" "TaskStop" "Monitor" "PushNotification"

      - name: capture run log
        if: always() && steps.data.outcome == 'success'
        run: |
          RUNBOOK_DIR=.claude/skills/gem-inwestycyjny/tracker-runbook
          FULL_DIR="$RUNBOOK_DIR/full"
          SUMMARY_FILE="$RUNBOOK_DIR/summary.jsonl"
          mkdir -p "$FULL_DIR"

          SRC=/home/runner/work/_temp/claude-execution-output.json
          if [ ! -f "$SRC" ]; then
            SRC=$(find /home/runner/work/_temp -maxdepth 1 -name '*execution-output*.json' 2>/dev/null | head -n1)
          fi

          DATE=$(date +%F)
          RUN_FILE="$FULL_DIR/run-${{ github.run_id }}-$DATE.json"

          if [ -n "$SRC" ] && [ -f "$SRC" ]; then
            cp "$SRC" "$RUN_FILE"
          else
            echo '{"error":"execution log not found at expected path"}' > "$RUN_FILE"
          fi

          # full summary (incl. error text) -> private summary.jsonl;
          # only turns/cost -> public log + Job Summary
          python3 .github/scripts/public_summary.py claude-run "$RUN_FILE" "$SUMMARY_FILE" \
            --run-id "${{ github.run_id }}" --date "$DATE" --title "Weekly Tracker (Agent 06)"
          python3 .github/scripts/public_summary.py tracker \
            .claude/skills/gem-inwestycyjny/history/recommendations.csv

          # lighter caps than the main pipeline: keep newest 3 full logs
          (cd "$FULL_DIR" && ls -1t run-*.json 2>/dev/null | tail -n +4 | xargs -r rm --)

          # keep newest 10 summary records
          if [ -f "$SUMMARY_FILE" ]; then
            tail -n 10 "$SUMMARY_FILE" > "$SUMMARY_FILE.tmp" && mv "$SUMMARY_FILE.tmp" "$SUMMARY_FILE"
          fi

      - name: annotate re-entry context
        if: always() && steps.data.outcome == 'success'
        run: |
          # pamiec miedzysystemowa: dopisz do rekomendacji kontekst wyjscia, jesli
          # ich ticker jest w closed_positions.csv (Auditor niedawno go zamknal).
          # Deterministyczny, idempotentny, tylko stdlib — bez pip.
          .github/scripts/quiet-run.sh reentry-context - -- \
            python3 skills/gem-position-auditor/reentry_context.py \
            .claude/skills/gem-inwestycyjny/history/recommendations.csv closed_positions.csv \
            || echo "reentry_context: non-fatal, pomijam"

      - name: verify report produced
        if: always() && steps.data.outcome == 'success'
        run: |
          # Same green-but-empty guard as gem-pipeline: a stalled Tracker can
          # self-report success without writing its weekly summary.
          if [ -s "$REPORT_FILE" ] && [ "$(wc -c < "$REPORT_FILE")" -gt 40 ]; then
            echo "REPORT_OK=true" >> "$GITHUB_ENV"
            echo "Tracker report present: $REPORT_FILE"
          else
            echo "REPORT_OK=false" >> "$GITHUB_ENV"
            echo "::error::Tracker reported success but $REPORT_FILE is missing/empty."
          fi

      - name: commit tracker update
        if: always() && steps.data.outcome == 'success'
        run: |
          cd data
          git config user.name "gem-bot"
          git config user.email "gem-bot@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository_owner }}/investing-partner-data.git"
          [ -f "$REPORT_FILE" ] && git add "$REPORT_FILE"
          [ -f .claude/skills/gem-inwestycyjny/history/recommendations.csv ] && git add .claude/skills/gem-inwestycyjny/history/recommendations.csv
          [ -d .claude/skills/gem-inwestycyjny/tracker-runbook ] && git add .claude/skills/gem-inwestycyjny/tracker-runbook
          [ -d ci-logs ] && git add ci-logs
          git commit -q -m "weekly tracker: $(date +%F) (run ${{ github.run_id }})" || echo "no changes"
          git push -q

      - name: set email subject date
        if: always()
        run: echo "MAIL_DATE=$(date +%d.%m.%Y)" >> "$GITHUB_ENV"

      - name: email report
        if: always() && env.REPORT_OK == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Gem Tracker
          to: ${{ secrets.MAIL_TO }}
          subject: "Gem Tracker — status rekomendacji ${{ env.MAIL_DATE }}"
          html_body: file://${{ env.REPORT_FILE }}
          convert_markdown: true

      - name: email failure notice
        if: always() && steps.preflight.outcome == 'success' && env.REPORT_OK != 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Gem Tracker
          to: ${{ secrets.MAIL_TO }}
          subject: "⚠️ Gem Tracker — run NIEUDANY ${{ env.MAIL_DATE }}"
          body: |
            Weekly Tracker zakończył się bez raportu (brak/pusty ${{ env.REPORT_FILE }}).
            Sprawdź logi:

            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: fail job if report missing
        if: always()
        run: |
          if [ "${REPORT_OK:-false}" != "true" ]; then
            echo "::error::Marking job as failed — no Tracker report produced."
            exit 1
          fi
